name: Generate Snake

on:
  # Har 24 soatda avtomatik ishga tushadi
  schedule:
    - cron: "0 0 * * *"
  
  # Istalgan payt qo'lda ham ishga tushirish imkoniyati
  workflow_dispatch:
  
  # main yoki master branchga o'zgarish bo'lganda ishlash
  push:
    branches:
    - main
    - master

jobs:
  generate:
    permissions: 
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    
    steps:
      # GitHub repository-ni tekshirish (Eng oxirgi versiya)
      - name: Checkout repository
        uses: actions/checkout@v4

      # Snake o'yinini generatsiya qilish (Node 24 va yangi tizimga moslangan v3)
      - name: Generate github-contribution-grid-snake.svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      # Generatsiya bo'lgan rasmlarni 'output' branchiga yuklash
      - name: Push github-contribution-grid-snake.svg to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
